services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops}
      POSTGRES_DB: ${POSTGRES_DB:-devops_wrapper}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Always points at the postgres service above, whatever .env says.
      DATABASE_URL: postgres://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-devops}@postgres:5432/${POSTGRES_DB:-devops_wrapper}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
