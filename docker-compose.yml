services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops}
      POSTGRES_DB: ${POSTGRES_DB:-devops_wrapper}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file: .env
    environment:
      # NOTE: this deliberately does NOT point at the "postgres" service
      # below. The real data (existing services, sessions, etc.) lives in a
      # Postgres container that was started outside this compose project
      # (published on the host's 5432) — the "postgres" service here is a
      # separate, empty database. host.docker.internal reaches that
      # existing container's published port from inside this one (Docker
      # Desktop only). If/when everything is migrated onto the "postgres"
      # service's own volume, switch this back to
      # postgres://...@postgres:5432/... and restore the depends_on below.
      DATABASE_URL: postgres://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-devops}@host.docker.internal:5432/${POSTGRES_DB:-devops_wrapper}
      PORT: "8080"
    volumes:
      # OpenTofu's provider cache: big providers (AWS is ~600 MB) are
      # downloaded once, not on every Terraform run.
      - tofu-plugins:/var/cache/panel-tofu
    ports:
      # Published so a host-run frontend (next dev, API_BASE_URL defaulting
      # to http://localhost:8080) can reach it without also being on the
      # compose network.
      - "8080:8080"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  tofu-plugins:
